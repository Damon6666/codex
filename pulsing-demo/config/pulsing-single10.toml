[completeness]
roster_filter = "review"    # 店名含此词的需每轮覆盖
round_anchor = "writer"
negative_keyword = "NEEDS_FIX"     # 以谁的信为轮次边界
review_letter_fence = "```"     # 审查信的留痕复述必须含代码块(逐字粘贴的脚本)
verbatim_anchor = true          # 审查信留痕的代码块必须与 writer 最新脚本逐字一致
anchor_signatures = ["import ", "def ", "class ", "from "]   # 裸贴(无围栏)底稿识别的代码签名 — 场景数据, 换语言改这里
acceptance_command = "python3 check_leakage.py {script}"   # 机械验收: 退出前对最终脚本跑泄漏检查

# fanout 审查信模板: {anchor_script} 占位符由 harness 替换为锚点店最新底稿逐字文本。
# 场景数据——换个团队(翻译/设计)就换这个模板, 代码零改动。
fanout_template = """
任务材料：以下是本轮待审查的完整脚本（与 writer 最新底稿逐字一致）。
请只按你的职责审查这一份材料，不运行任何工具或命令。
结论回信只用 CLEAN 或 NEEDS_FIX（附具体问题和位置），并在下一行写『依据：…』，不要在回信中重复脚本原文。

```python
{anchor_script}
```
"""

