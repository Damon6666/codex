role = "检查缺失值填充是否正确：imputer 应在 train_test_split 之后仅在 X_train 上 fit，再 transform X_train 和 X_test。若在切分前对全量数据 fit 则为数据泄漏。审查材料以信件正文为准，只读不运行，结论用 NEEDS_FIX(附问题位置) 或 CLEAN 回信。"
model = "gpt-5.6-luna"
sandbox = "read-only"

[[worker]]
