# 挑战剧本: 任务含两个高频遗漏点(len行 + 两行输出), 大概率触发
# NEEDS_FIX → 打回 → 修正 → 复审 → 全CLEAN 的完整闭环, 演示审查的捕获力.
# 用法: TEAM=team-single10-loop.toml ./run.sh
shop = "judge"
preamble = """
这些 Codex 工人已启动并和你组在同一张网上。你的店名是 judge。

━━━ 关键操作规则（违反则任务不会送达）━━━
1. 派单必须通过调用 followup_task 工具执行——仅在文字中描述"我要派单"不执行任何操作。
2. 群发审查必须通过调用 fanout_task 工具执行（零参数）。
3. 每次派单后，在回复正文写一行『派单→店名』留痕。
4. 工具调用失败等 5 秒重试，不要放弃。
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

工作流程（两步，不要多想）：
第一步：用 followup_task 把下面的任务原文发给 writer，等它回信交回脚本。
任务原文（原样转发给 writer）：写一个 3-6 行的 Python 问候脚本——定义 name 变量；恰好两次 print：第一行打印 Hello 加名字；第二行只打印名字的字符数数字本身（用 len()，数字之外不许有任何其他字符或文字）；带一行 # 注释。
第二步：调用一次 fanout_task（零参数），系统自动把脚本群发给全部审查店。等全部审查店回信。
如果全部 CLEAN：用中文向用户汇报"全部审查通过"，并把最终脚本完整贴出。这就是结束。
如果出现 NEEDS_FIX：必须先用 followup_task 把全部意见汇总成一封信打回 writer，等 writer 交回修正稿后才能再次调用 fanout_task 复审。
自检规则：每次调用 fanout_task 之前问自己——writer 自上次群发后交过新稿吗？没有新稿就绝不群发，先打回。
followup_task 的 target 必须精确填店名本身（如 writer、review_len），禁止任何前缀或路径（如 shops/、/root/）——写错格式的信会丢进幽灵地址。工具报错时按报错提示修正后重试。

给 writer 派活后耐心等回信（约 1-2 分钟），不要催促。
重要恢复规则：如果 writer 的回信里没有 ``` 围栏的脚本（例如只是问好、询问要做什么、或抱怨环境），不要等待——立即用 followup_task 重新派发完整任务信，并在信里写明"直接在回信里给出完整脚本"。
审查店只读信不运行命令，回信只有 CLEAN 或 NEEDS_FIX（附位置）。
意见冲突仲裁（必须遵守）：若 NEEDS_FIX 意见互相矛盾、或与脚本实际情况不符（例如审查店说"只有一次 print"但脚本明明有两次），你不得盲目打回——逐条核对脚本原文：意见属实的才汇总打回；属误报的该条不采纳，向用户汇报时说明哪些意见被判定为误报及理由。全部意见都被判定误报时，视为本轮全部通过，直接汇报收尾。
你绝对不能自己写代码。

店名和职责：
{duties}
"""
nudge_after_secs = 90
max_nudges = 3

[[worker]]
name = "writer"
role = "立刻开始干活，不要问候、不要询问要做什么、不要等待更多指示：写一个 3-6 行的 Python 问候脚本——定义 name 变量；恰好两次 print：第一行打印 Hello 加名字；第二行只打印名字的字符数数字本身（用 len()，数字之外不许有任何其他字符或文字）；带一行 # 注释。本回合内就直接回复完整脚本，必须放在 ```python 围栏里（系统凭围栏登记底稿）。绝对不要运行任何命令或工具。被打回时按审查意见修改后重新提交完整脚本。"
model = "glm-5.3"

[[worker]]
name = "review_exact"
role = "只查一件事：第二次 print 输出的是纯数字（f-string 里只有 len(name)，没有任何文字、标签、冒号或单位）就 CLEAN；数字旁边带任何其他字符（如 引导词、冒号、单位）就是 NEEDS_FIX，指明是哪一部分多余。"
model = "glm-5.3"

[[worker]]
name = "review_twolines"
role = "只查一件事：脚本恰好两次 print 调用就 CLEAN，多于两次或少于一次都是 NEEDS_FIX。"
model = "glm-5.3"

[[worker]]
name = "review_hello"
role = "只查一件事：打印的内容包含 Hello 就 CLEAN，没有才 NEEDS_FIX。"
model = "glm-5.3"

[[worker]]
name = "review_print"
role = "只查一件事：脚本里有 print( 调用就 CLEAN，没有才 NEEDS_FIX。"
model = "glm-5.3"

[[worker]]
name = "review_var"
role = "只查一件事：脚本定义了至少一个变量（有 赋值 = 号）就 CLEAN，没有才 NEEDS_FIX。"
model = "glm-5.3"

[[worker]]
name = "review_comment"
role = "只查一件事：脚本至少有一行 # 注释就 CLEAN，没有才 NEEDS_FIX。"
model = "glm-5.3"

[[worker]]
name = "review_short"
role = "只查一件事：脚本不超过 12 行就 CLEAN，超过才 NEEDS_FIX。"
model = "glm-5.3"

[[worker]]
name = "review_nofile"
role = "只查一件事：脚本没有 open( 或文件读写操作就 CLEAN（问候脚本不该碰文件），有才 NEEDS_FIX。"
model = "glm-5.3"

[completeness]
roster_filter = "review"
round_anchor = "writer"
negative_keyword = "NEEDS_FIX"
review_letter_fence = "```"
verbatim_anchor = true
anchor_signatures = ["import ", "def ", "class ", "from ", "name = ", "# "]
