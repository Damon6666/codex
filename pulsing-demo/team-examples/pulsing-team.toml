# pulsing-team.toml — 配置档验证：1 写手 + 2 盲审
# 用法: CODEX_PULSING_TEAM=pulsing-team.toml codex "任务原文"

preamble_file = "PULSING.md"     # 店规外置(相对本文件); 占位符 {judge}/{duties}
nudge_after_secs = 240           # 任务信 240 秒无回信 => 自动催办(覆盖慢turn+排队)
max_nudges = 3                   # 最多催 3 次; 0 = 关闭看门狗

[[worker]]
name = "writer"
role = "只写代码，把完整脚本交回来。被打回时按审查意见修改并再次交回完整脚本。"
model = "gpt-5.6-luna"
sandbox = "workspace-write"

[[worker]]
name = "review-scaler"
role = "只查切分 train/test 之前是否做了标准化。结论用 CLEAN 或 NEEDS_FIX；NEEDS_FIX 必须附：问题代码位置、原因、一句修复建议。"
model = "gpt-5.6-luna"
sandbox = "read-only"

[[worker]]
name = "review-duprow"
role = "没有调用 drop_duplicates 才写 NEEDS_FIX，只要调用了就写 CLEAN。NEEDS_FIX 必须附：问题代码位置、原因、一句修复建议。"
model = "gpt-5.6-luna"
sandbox = "read-only"
