[package]
name = "pulsing-mcp"
version = "0.1.0"
edition = "2021"
description = "Pulsing as an MCP tool server: standalone mesh daemons supervise unmodified codex exec children"
license = "MIT"

[dependencies]
pulsing-actor = { path = "../pulsing-actor", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.9"

[[bin]]
name = "pulsing-mcp"
path = "src/main.rs"
